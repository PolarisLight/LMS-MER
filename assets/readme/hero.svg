    <circle cx="159" cy="182" r="12" fill="#E65358" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M159 116V79" stroke="#E65358" stroke-width="2"/>
    <rect x="103" y="46" width="112" height="32" rx="16" fill="#FCEDEE" stroke="#F0C4C7"/><text x="159" y="67" text-anchor="middle" fill="#B83C43" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700">HIGH LMS</text>
    <path d="M241 182H304" stroke="#75879A" stroke-width="2.5" marker-end="url(#arrow)"/><text x="272" y="165" text-anchor="middle" fill="#617285" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700">MER</text>
    <path d="M345 232C382 161 455 122 535 140C549 177 530 230 479 255C427 280 374 266 345 232Z" fill="#FCEDEE" stroke="#E65358" stroke-width="2"/>
    <g fill="#E65358"><circle cx="385" cy="223" r="10"/><circle cx="422" cy="179" r="11"/><circle cx="468" cy="159" r="9"/><circle cx="505" cy="189" r="10"/><circle cx="465" cy="229" r="10"/><circle cx="513" cy="237" r="8"/><circle cx="420" cy="237" r="8"/></g>
    <g fill="#1A9CCC" opacity=".72"><circle cx="372" cy="123" r="7"/><circle cx="515" cy="107" r="8"/><circle cx="550" cy="274" r="7"/><circle cx="336" cy="276" r="8"/></g>
    <path d="M435 282V316" stroke="#2B9D8F" stroke-width="2"/><rect x="361" y="316" width="148" height="34" rx="17" fill="#EAF5F2" stroke="#BFE1D9"/><text x="435" y="338" text-anchor="middle" fill="#26796D" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700">RESTORED SUPPORT</text>
    <g transform="translate(8 366)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14"><circle cx="7" cy="0" r="6" fill="#1A9CCC"/><text x="21" y="5" fill="#617285">HEAD NEIGHBOR</text><circle cx="166" cy="0" r="6" fill="#E65358"/><text x="180" y="5" fill="#617285">TAIL SAMPLE</text></g>
  </g>
