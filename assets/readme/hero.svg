    <path d="M14 222C94 92 194 108 258 204C334 319 438 294 562 150" fill="none" stroke="#8BA0B3" stroke-width="2"/>
    <g fill="#1A9CCC">
      <circle cx="88" cy="182" r="9"/><circle cx="112" cy="155" r="8"/><circle cx="136" cy="176" r="10"/><circle cx="158" cy="148" r="8"/><circle cx="177" cy="186" r="9"/><circle cx="116" cy="207" r="8"/><circle cx="151" cy="214" r="8"/><circle cx="196" cy="160" r="8"/><circle cx="191" cy="209" r="7"/>
