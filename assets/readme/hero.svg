<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">LMS-MER — Local Manifold Sensitivity and Regularization</title>
  <desc id="desc">A light academic hero showing LMS diagnosing a fragile tail sample and MER restoring its local manifold.</desc>
  <defs>
    <linearGradient id="manifold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9EEF8"/><stop offset=".55" stop-color="#E2F3EF"/><stop offset="1" stop-color="#FBE3E3"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#75879A"/></marker>
  </defs>
  <rect width="1200" height="400" rx="28" fill="#FBFCFE"/>
  <rect x="1" y="1" width="1198" height="398" rx="27" fill="none" stroke="#DDE5ED" stroke-width="2"/>
  <path d="M0 322C212 280 382 354 574 322C792 286 982 322 1200 255V400H0Z" fill="#F1F5F9"/>
  <path d="M558 30V370" stroke="#DFE6ED"/>

  <g transform="translate(54 48)">
    <text x="0" y="0" fill="#617285" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700" letter-spacing="2.2">ACM MM ’26 · LONG-TAILED RECOGNITION</text>
    <text x="0" y="82" fill="#162436" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="72" font-weight="800" letter-spacing="-3">LMS<tspan fill="#E65358">·</tspan>MER</text>
    <text x="0" y="130" fill="#32465C" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="26" font-weight="650">Local Manifold Sensitivity</text>
    <text x="0" y="164" fill="#32465C" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="26" font-weight="650">&amp; Manifold Expansion Regularization</text>
    <text x="0" y="222" fill="#617285" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20">Diagnose geometric fragility. Restore local support.</text>
    <g transform="translate(0 270)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700">
      <rect width="148" height="38" rx="19" fill="#EAF5FA" stroke="#B8DCEB"/><text x="74" y="25" text-anchor="middle" fill="#176C91">LABEL-FREE LMS</text>
      <rect x="160" width="170" height="38" rx="19" fill="#FCEDEE" stroke="#F0C4C7"/><text x="245" y="25" text-anchor="middle" fill="#B83C43">PLUG-IN MER</text>
      <rect x="342" width="150" height="38" rx="19" fill="#EAF5F2" stroke="#BFE1D9"/><text x="417" y="25" text-anchor="middle" fill="#26796D">LOCAL SUPPORT</text>
    </g>
  </g>

  <g transform="translate(592 32)">
